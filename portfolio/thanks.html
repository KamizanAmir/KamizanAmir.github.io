<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Message received — Kamizan Amirudin's arcade CV.">
    <meta name="theme-color" content="#070A10">
    <meta name="robots" content="noindex">
    <title>Message Sent | Kamizan Arcade CV</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.ico" type="image/x-icon">

    <style>
        /* Page-specific only. Everything else — tokens, sky, panel, buttons —
           comes from styles.css, so this page cannot drift from the game. */
        body {
            overflow: auto;
        }

        .done {
            position: relative;
            z-index: 100;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 30px 20px calc(var(--ground-h) + 40px);
        }

        .done-card {
            width: min(560px, 100%);
            text-align: center;
            padding: 34px 26px;
            border: 3px solid var(--accent-deep);
            border-radius: 14px;
            background: var(--panel-bg);
            box-shadow: var(--pixel-shadow), 0 0 60px rgba(23, 166, 115, 0.16);
        }

        .coin {
            display: grid;
            place-items: center;
            width: 76px;
            height: 76px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 4px solid var(--accent-deep);
            background: rgba(61, 220, 151, 0.12);
            color: var(--accent);
            font-size: 28px;
        }

        .done-card h1 {
            font-family: var(--font-pixel);
            font-size: clamp(14px, 4.4vw, 19px);
            line-height: 1.8;
            color: var(--accent);
            margin-bottom: 14px;
        }

        .done-card p {
            color: var(--text-soft);
            margin-bottom: 22px;
        }

        .score {
            display: inline-block;
            font-family: var(--font-pixel);
            font-size: 8px;
            letter-spacing: 0.06em;
            color: var(--text-dim);
            border: 2px solid var(--line-strong);
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 20px;
        }

        .score b {
            color: var(--accent);
            font-weight: 400;
        }
    </style>
</head>

<body>
    <div class="sky" aria-hidden="true"></div>
    <div class="stars" aria-hidden="true"></div>
    <div class="hills-far" aria-hidden="true"></div>
    <div class="hills-near" aria-hidden="true"></div>
    <div class="ground" aria-hidden="true"></div>

    <main class="done">
        <div class="done-card">
            <span class="coin" aria-hidden="true"><i class="fas fa-check"></i></span>

            <span class="score">STATUS <b>200</b> &middot; DELIVERED</span>

            <h1>MESSAGE SENT</h1>

            <p>
                Thanks for reaching out — it's in my inbox and I usually reply
                within a day. If it's urgent, WhatsApp is faster.
            </p>

            <div class="btn-row">
                <a href="index.html" class="btn btn--primary">
                    <i class="fas fa-gamepad" aria-hidden="true"></i> BACK TO THE GAME
                </a>
                <a href="../index.html" class="btn btn--ghost">STANDARD CV</a>
            </div>
        </div>
    </main>
</body>

</html>
